{% extends "base.html" %}
{% block title %}Staff sign-in · CloudBinder{% endblock %}
{% block body %}
<div class="app">
<main class="stack">
  <span class="brand">{% include "brand.html" %}<span class="brand-sub">Staff</span></span>
  <h1>Staff sign-in</h1>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash" role="status">{{ m }}</div>{% endfor %}{% endwith %}
  <form method="post" class="stack">
    <div>
      <label for="passcode">Passcode</label>
      <input type="password" id="passcode" name="passcode" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn primary block">Sign in</button>
  </form>
</main>
</div>
{% endblock %}
